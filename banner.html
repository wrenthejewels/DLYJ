<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLYJ — Banner Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #FAFAFA; }

    .banner-wrap {
      position: relative;
      width: 100%;
      height: 340px;
      overflow: hidden;
      border-bottom: 1px solid #E8E4DD;
    }

    #banner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div class="banner-wrap">
  <canvas id="banner"></canvas>
</div>

<script>
const canvas = document.getElementById('banner');
const ctx    = canvas.getContext('2d');
const DPR    = Math.min(window.devicePixelRatio || 1, 2);

const CELL     = 6;    // grid cell size (px)
const N_LEVELS = 10;   // contour levels
const N_GROUPS = 15;   // figure groups

let W, H;
let contourData, groups;
let animId, t0;

// ── Palette ────────────────────────────────────────────────────────────────
const C = {
  bg:         '#FAFAFA',
  ink:        '#1C1B18',
  inkSoft:    '#5C5850',
  matcha:     '#4d7a52',
  matchaDark: '#3b5e40',
};

// ── Perlin Noise ───────────────────────────────────────────────────────────
function makeNoise() {
  const src = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [src[i], src[j]] = [src[j], src[i]];
  }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = src[i & 255];

  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp  = (a, b, t) => a + t * (b - a);
  const grad  = (h, x, y) => {
    switch (h & 7) {
      case 0: return  x + y; case 1: return -x + y;
      case 2: return  x - y; case 3: return -x - y;
      case 4: return  x;     case 5: return -x;
      case 6: return  y;     case 7: return -y;
      default: return 0;
    }
  };

  function noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const a = p[X] + Y, b = p[X + 1] + Y;
    return lerp(
      lerp(grad(p[a],     x,   y  ), grad(p[b],     x - 1, y  ), u),
      lerp(grad(p[a + 1], x,   y - 1), grad(p[b + 1], x - 1, y - 1), u),
      v
    );
  }

  function fbm(x, y) {
    return noise(x,    y   ) * 0.500
         + noise(x*2,  y*2 ) * 0.250
         + noise(x*4,  y*4 ) * 0.125
         + noise(x*8,  y*8 ) * 0.063;
  }

  return { noise, fbm };
}

// ── Marching Squares ───────────────────────────────────────────────────────
function buildContours(field, rows, cols, levels) {
  const out = levels.map(() => []);

  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      const tl = field[ r      * cols + c    ];
      const tr = field[ r      * cols + c + 1];
      const br = field[(r + 1) * cols + c + 1];
      const bl = field[(r + 1) * cols + c    ];

      for (let li = 0; li < levels.length; li++) {
        const tv  = levels[li];
        const idx = (tl >= tv ? 8 : 0) | (tr >= tv ? 4 : 0)
                  | (br >= tv ? 2 : 0) | (bl >= tv ? 1 : 0);
        if (idx === 0 || idx === 15) continue;

        const ip = (a, b) => {
          const d = b - a;
          return Math.abs(d) < 1e-7 ? 0.5 : Math.max(0, Math.min(1, (tv - a) / d));
        };

        const top = [c + ip(tl, tr), r    ];
        const rgt = [c + 1,          r + ip(tr, br)];
        const bot = [c + ip(bl, br), r + 1];
        const lft = [c,              r + ip(tl, bl)];

        const s = out[li];
        switch (idx) {
          case  1: s.push(lft, bot); break;
          case  2: s.push(bot, rgt); break;
          case  3: s.push(lft, rgt); break;
          case  4: s.push(top, rgt); break;
          case  5: s.push(top, lft); s.push(bot, rgt); break;
          case  6: s.push(top, bot); break;
          case  7: s.push(top, lft); break;
          case  8: s.push(top, lft); break;
          case  9: s.push(top, bot); break;
          case 10: s.push(top, rgt); s.push(lft, bot); break;
          case 11: s.push(top, rgt); break;
          case 12: s.push(lft, rgt); break;
          case 13: s.push(rgt, bot); break;
          case 14: s.push(lft, bot); break;
        }
      }
    }
  }

  return out;
}

// ── Figure Drawing ─────────────────────────────────────────────────────────
function drawFigure(x, y, scale, color, pose, sway) {
  ctx.save();
  ctx.translate(x + sway, y - Math.abs(sway) * 0.18);
  ctx.scale(scale, scale);

  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = 1.6;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  // Head
  ctx.beginPath();
  ctx.arc(0, -9, 2.8, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.beginPath();
  ctx.moveTo(0, -6.2);
  ctx.lineTo(0,  1.0);
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(0, 1); ctx.lineTo(-3,  7);
  ctx.moveTo(0, 1); ctx.lineTo( 3,  7);
  ctx.stroke();

  // Arms by pose
  ctx.beginPath();
  switch (pose) {
    case 'up':
      ctx.moveTo(0, -4); ctx.lineTo(-5, -8);
      ctx.moveTo(0, -4); ctx.lineTo( 5, -8);
      break;
    case 'out':
      ctx.moveTo(0, -4); ctx.lineTo(-6, -2);
      ctx.moveTo(0, -4); ctx.lineTo( 6, -2);
      break;
    case 'point':
      ctx.moveTo(0, -4); ctx.lineTo(-3,  0);
      ctx.moveTo(0, -4); ctx.lineTo( 6, -7);
      break;
    case 'reach':
      ctx.moveTo(0, -4); ctx.lineTo(-5, -7);
      ctx.moveTo(0, -4); ctx.lineTo( 3,  2);
      break;
    default: // natural
      ctx.moveTo(0, -4); ctx.lineTo(-3, 0);
      ctx.moveTo(0, -4); ctx.lineTo( 3, 0);
  }
  ctx.stroke();
  ctx.restore();
}

// ── Figure Groups ──────────────────────────────────────────────────────────
const POSES = ['natural', 'natural', 'up', 'out', 'point', 'reach'];

function makeGroups(noise) {
  const gs     = [];
  const margin = 55;
  const s      = 0.003; // must match field noise scale below

  for (let g = 0; g < N_GROUPS; g++) {
    const cx = margin + Math.random() * (W - margin * 2);
    const cy = margin + Math.random() * (H - margin * 2);

    // Orient group along the local contour direction
    const e  = 10;
    const nx = noise.fbm((cx + e) * s, cy * s) - noise.fbm((cx - e) * s, cy * s);
    const ny = noise.fbm(cx * s, (cy + e) * s) - noise.fbm(cx * s, (cy - e) * s);
    const angle   = Math.atan2(-nx, ny); // perpendicular to gradient

    const size    = 3 + Math.floor(Math.random() * 3);
    const spacing = 13 + Math.random() * 5;
    const baseCol = Math.random() < 0.5 ? C.ink : C.inkSoft;
    const figs    = [];

    for (let f = 0; f < size; f++) {
      const off = (f - (size - 1) / 2) * spacing;
      figs.push({
        dx:    Math.cos(angle) * off,
        dy:    Math.sin(angle) * off,
        scale: 0.80 + Math.random() * 0.34,
        color: Math.random() < 0.18 ? C.matcha : baseCol,
        pose:  POSES[Math.floor(Math.random() * POSES.length)],
        phase: Math.random() * Math.PI * 2,
        speed: 0.50 + Math.random() * 0.50,
      });
    }

    gs.push({ cx, cy, figs });
  }

  return gs;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(t) {
  // Background
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  // Contour lines
  for (let li = 0; li < contourData.length; li++) {
    const segs = contourData[li];
    if (!segs.length) continue;

    const isIndex = li % 3 === 1;
    const base    = isIndex ? 0.26 : 0.13;
    const breath  = 0.88 + 0.12 * Math.sin(t * 0.30 + li * 0.52);

    ctx.beginPath();
    ctx.strokeStyle = `rgba(77, 122, 82, ${(base * breath).toFixed(3)})`;
    ctx.lineWidth   = isIndex ? 1.4 : 0.85;
    ctx.lineCap     = 'round';

    for (let i = 0; i < segs.length; i += 2) {
      ctx.moveTo(segs[i    ][0] * CELL, segs[i    ][1] * CELL);
      ctx.lineTo(segs[i + 1][0] * CELL, segs[i + 1][1] * CELL);
    }
    ctx.stroke();
  }

  // Figures
  groups.forEach(g => {
    g.figs.forEach(f => {
      const sway = Math.sin(t * f.speed + f.phase) * 1.4;
      drawFigure(g.cx + f.dx, g.cy + f.dy, f.scale, f.color, f.pose, sway);
    });
  });

  // Edge fades — blend into background at borders
  const fade = (x1, y1, x2, y2, rx, ry, rw, rh) => {
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    g.addColorStop(0, 'rgba(250,250,250,0.92)');
    g.addColorStop(1, 'rgba(250,250,250,0)');
    ctx.fillStyle = g;
    ctx.fillRect(rx, ry, rw, rh);
  };
  const f = 52;
  fade(0,   0,   0,   f,   0,     0,     W, f); // top
  fade(0,   H,   0,   H-f, 0,     H - f, W, f); // bottom
  fade(0,   0,   f,   0,   0,     0,     f, H); // left
  fade(W,   0,   W-f, 0,   W - f, 0,     f, H); // right
}

function loop(ts) {
  if (!t0) t0 = ts;
  render((ts - t0) / 1000);
  animId = requestAnimationFrame(loop);
}

// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  if (animId) { cancelAnimationFrame(animId); animId = null; t0 = null; }

  W = canvas.parentElement.clientWidth;
  H = canvas.parentElement.clientHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const noise = makeNoise();
  const scale = 0.003;                       // noise frequency per pixel
  const cols  = Math.ceil(W / CELL) + 2;
  const rows  = Math.ceil(H / CELL) + 2;
  const field = new Float32Array(rows * cols);

  let mn = Infinity, mx = -Infinity;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = noise.fbm(c * CELL * scale, r * CELL * scale);
      field[r * cols + c] = v;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
  }

  // Normalize to [0, 1]
  const rng = mx - mn || 1;
  for (let i = 0; i < field.length; i++) field[i] = (field[i] - mn) / rng;

  // Evenly spaced contour levels
  const levels = Array.from({ length: N_LEVELS }, (_, i) =>
    0.05 + 0.90 * (i / (N_LEVELS - 1))
  );

  contourData = buildContours(field, rows, cols, levels);
  groups      = makeGroups(noise);
  animId      = requestAnimationFrame(loop);
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(init, 180);
});

init();
</script>

</body>
</html>
